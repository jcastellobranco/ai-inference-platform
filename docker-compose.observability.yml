# Local-only ATLAS observability. Requires integrated + agents + redis overlays.
# Dashboard and scrape configuration live in sibling llm-evaluation-observability.
services:
  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ../llm-evaluation-observability/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - atlas_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend
      - evaluation
      - rag
      - worker
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run make init to generate a local Grafana admin password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
    volumes:
      - ../llm-evaluation-observability/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../llm-evaluation-observability/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../llm-evaluation-observability/observability/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - atlas_grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
    security_opt:
      - no-new-privileges:true

  worker:
    environment:
      WORKER_METRICS_ENABLED: "true"
      WORKER_METRICS_PORT: "9101"
    expose:
      - "9101"

  loki-init:
    image: busybox:1.36
    command: ["sh", "-ec", "mkdir -p /loki && chown -R 10001:10001 /loki"]
    volumes:
      - atlas_loki_data:/loki
    restart: "no"

  loki:
    image: grafana/loki:3.5.0
    user: "10001:10001"
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../llm-evaluation-observability/observability/loki.yml:/etc/loki/loki.yml:ro
      - atlas_loki_data:/loki
    depends_on:
      loki-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  # Docker socket is only mounted in this GET-only proxy. The proxy has
  # no published ports and is reachable solely from the isolated collector network.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
      IMAGES: "0"
      NETWORKS: "1"
      SERVICES: "0"
      EXEC: "0"
      AUTH: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_logs
    security_opt:
      - no-new-privileges:true

  alloy:
    image: grafana/alloy:v1.10.0
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ../llm-evaluation-observability/observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - atlas_alloy_data:/var/lib/alloy/data
    depends_on:
      - docker-proxy
      - loki
    networks:
      - default
      - docker_logs
    security_opt:
      - no-new-privileges:true

networks:
  docker_logs:
    internal: true

volumes:
  atlas_loki_data:
  atlas_alloy_data:
  atlas_prometheus_data:
  atlas_grafana_data:
