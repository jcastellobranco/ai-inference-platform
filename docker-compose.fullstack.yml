services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d platform"]
      interval: 5s
      retries: 10
  migrate:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: app
    volumes:
      - ./backend/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql -h db -U app -d platform -v ON_ERROR_STOP=1 -f /migrations/001_init.sql
        psql -h db -U app -d platform -v ON_ERROR_STOP=1 -f /migrations/002_roles.sql
        psql -h db -U app -d platform -v ON_ERROR_STOP=1 -f /migrations/003_seed.sql
        psql -h db -U app -d platform -v ON_ERROR_STOP=1 -f /migrations/004_durable_jobs.sql
        psql -h db -U app -d platform -v ON_ERROR_STOP=1 -f /migrations/005_worker.sql
        psql -h db -U app -d platform -v ON_ERROR_STOP=1 -f /migrations/006_retry_state.sql
        # Historical migrations 007-009 narrow CHECK constraints. Reapplying them
        # against an upgraded database would reject already-persisted agent jobs.
        # Do not edit historical SQL; detect the upgraded schema and skip them.
        if [ "$(psql -h db -U app -d platform -v ON_ERROR_STOP=1 -Atc "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'jobs' AND column_name = 'agent_workflow')")" = "t" ]; then
          echo "Existing agent workflow schema detected; skipping historical migrations 007-009"
        else
          psql -h db -U app -d platform -v ON_ERROR_STOP=1 -f /migrations/007_rag_jobs.sql
          psql -h db -U app -d platform -v ON_ERROR_STOP=1 -f /migrations/008_agent_jobs.sql
          psql -h db -U app -d platform -v ON_ERROR_STOP=1 -f /migrations/009_agent_workflow.sql
        fi
        psql -h db -U app -d platform -v ON_ERROR_STOP=1 -f /migrations/010_compliance_workflow.sql
        psql -h db -U app -d platform -v ON_ERROR_STOP=1 -f /migrations/011_compliance_documents.sql
    restart: "no"
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://platform_runtime:local-development-only@db:5432/platform
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random 32+ character value}
      JWT_ISSUER: portfolio-dev
      JWT_AUDIENCE: ai-platform
      RAG_SERVICE_TENANT_ID: ${RAG_SERVICE_TENANT_ID:-}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-}
      RAG_SERVICE_API_KEY: ${RAG_SERVICE_API_KEY:-}
      EVAL_SERVICE_URL: ${EVAL_SERVICE_URL:-}
      EVAL_SERVICE_API_KEY: ${EVAL_SERVICE_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      WORKER_DATABASE_URL: postgresql+psycopg://platform_worker:local-worker-development-only@db:5432/platform
      RAG_SERVICE_TENANT_ID: ${RAG_SERVICE_TENANT_ID:-}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-}
      RAG_SERVICE_API_KEY: ${RAG_SERVICE_API_KEY:-}
      EVAL_SERVICE_URL: ${EVAL_SERVICE_URL:-}
      EVAL_SERVICE_API_KEY: ${EVAL_SERVICE_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  pgdata:
