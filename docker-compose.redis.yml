# Optional local Redis. Create .secrets/redis_password (untracked).
services:
  redis:
    image: redis:7.4-alpine
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        password="$$(cat /run/secrets/atlas_redis_password)"
        test "$$(printf %s "$$password" | wc -c)" -ge 32
        printf 'save ""\nappendonly no\nmaxmemory 128mb\nmaxmemory-policy allkeys-lru\nrequirepass %s\n' "$$password" > /tmp/redis.conf
        unset password
        exec redis-server /tmp/redis.conf
    secrets: [atlas_redis_password]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/atlas_redis_password) redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
  agent:
    environment:
      ATLAS_REDIS_HOST: redis
      ATLAS_REDIS_PASSWORD_FILE: /run/secrets/atlas_redis_password
      ATLAS_PLANNER_CACHE_ENABLED: "true"
      ATLAS_CACHE_HMAC_KEY: ${ATLAS_CACHE_HMAC_KEY:?Set a unique 32+ character HMAC key}
      ATLAS_PLANNER_CACHE_TTL_SECONDS: ${ATLAS_PLANNER_CACHE_TTL_SECONDS:-120}
    secrets: [atlas_redis_password]
    depends_on:
      redis:
        condition: service_healthy
  backend:
    environment:
      ATLAS_REDIS_HOST: redis
      ATLAS_REDIS_PASSWORD_FILE: /run/secrets/atlas_redis_password
      ATLAS_RATE_LIMIT_ENABLED: "true"
      ATLAS_RATE_LIMIT_PER_MINUTE: ${ATLAS_RATE_LIMIT_PER_MINUTE:-120}
    secrets: [atlas_redis_password]
    depends_on:
      redis:
        condition: service_healthy
secrets:
  atlas_redis_password:
    file: ./.secrets/redis_password
