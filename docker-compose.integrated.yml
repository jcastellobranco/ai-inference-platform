# Run from ai-inference-platform with sibling checkouts of both repositories.
# docker compose -f docker-compose.fullstack.yml -f docker-compose.integrated.yml up --build
services:
  rag-db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${RAG_DB_OWNER_PASSWORD:?Set RAG_DB_OWNER_PASSWORD}
    volumes:
      - ragdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d rag"]
      interval: 5s
      retries: 15
  rag-migrate:
    image: pgvector/pgvector:pg17
    environment:
      PGPASSWORD: ${RAG_DB_OWNER_PASSWORD:?Set RAG_DB_OWNER_PASSWORD}
    volumes:
      - ../rag-document-intelligence/migrations:/migrations:ro
    depends_on:
      rag-db:
        condition: service_healthy
    entrypoint: ["/bin/sh","-c"]
    command: >
      psql -h rag-db -U postgres -d rag -v ON_ERROR_STOP=1 -f /migrations/001_pgvector.sql &&
      psql -h rag-db -U postgres -d rag -v ON_ERROR_STOP=1 -f /migrations/002_local_role.sql
  rag:
    build:
      context: ../rag-document-intelligence
      dockerfile: Dockerfile.vector
    environment:
      RAG_DATABASE_URL: postgresql+psycopg://rag_runtime:local-rag-development-only@rag-db:5432/rag
      RAG_TENANT_ID: "11111111-1111-4111-8111-111111111111"
      RAG_API_KEY: ${RAG_API_KEY:?Set RAG_API_KEY}
    depends_on:
      rag-migrate:
        condition: service_completed_successfully
  evaluation:
    build:
      context: ../llm-evaluation-observability
    environment:
      EVAL_API_KEY: ${EVAL_API_KEY:?Set EVAL_API_KEY}
  backend:
    environment:
      RAG_SERVICE_TENANT_ID: "11111111-1111-4111-8111-111111111111"
      RAG_SERVICE_URL: http://rag:8000
      RAG_SERVICE_API_KEY: ${RAG_API_KEY:?Set RAG_API_KEY}
      EVAL_SERVICE_URL: http://evaluation:8000
      EVAL_SERVICE_API_KEY: ${EVAL_API_KEY:?Set EVAL_API_KEY}
    depends_on:
      rag:
        condition: service_started
      evaluation:
        condition: service_started
  worker:
    environment:
      RAG_SERVICE_TENANT_ID: "11111111-1111-4111-8111-111111111111"
      RAG_SERVICE_URL: http://rag:8000
      RAG_SERVICE_API_KEY: ${RAG_API_KEY:?Set RAG_API_KEY}
      EVAL_SERVICE_URL: http://evaluation:8000
      EVAL_SERVICE_API_KEY: ${EVAL_API_KEY:?Set EVAL_API_KEY}
      RAG_GENERATION_ENABLED: ${RAG_GENERATION_ENABLED:-false}
      GENERATION_API_URL: ${GENERATION_API_URL:-}
      GENERATION_API_KEY: ${GENERATION_API_KEY:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-}
    depends_on:
      rag:
        condition: service_started
      evaluation:
        condition: service_started
  integration-smoke:
    profiles: ["smoke"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.integration_smoke"]
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      RAG_SERVICE_TENANT_ID: "11111111-1111-4111-8111-111111111111"
      RAG_SERVICE_URL: http://rag:8000
      RAG_SERVICE_API_KEY: ${RAG_API_KEY:?Set RAG_API_KEY}
      EVAL_SERVICE_URL: http://evaluation:8000
      EVAL_SERVICE_API_KEY: ${EVAL_API_KEY:?Set EVAL_API_KEY}
      INFERENCE_SERVICE_URL: http://backend:8000
    depends_on:
      - backend
      - worker
      - rag
      - evaluation
volumes:
  ragdata:
