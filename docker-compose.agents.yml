# Optional ATLAS agent/MCP integration overlay.
# Requires sibling checkouts of multi-agent-orchestration and mcp-tool-platform.
services:
  agent:
    build:
      context: ../multi-agent-orchestration
      dockerfile: Dockerfile.agent-demo
    environment:
      ATLAS_AGENT_SERVICE_KEY: ${ATLAS_AGENT_SERVICE_KEY:?Set a random 32+ character ATLAS_AGENT_SERVICE_KEY}
      ATLAS_AGENT_TENANT_ID: "11111111-1111-4111-8111-111111111111"
      MCP_TOOL_PROJECT_DIR: /opt/mcp-tool-platform
      MCP_ALLOWED_SCOPES: text:read,text:hash
      MCP_PYTHON: python
      ATLAS_RAG_URL: http://rag:8000
      ATLAS_RAG_API_KEY: ${RAG_API_KEY:?Set RAG_API_KEY}
      ATLAS_TENANT_ID: "11111111-1111-4111-8111-111111111111"
    volumes:
      - ../mcp-tool-platform:/opt/mcp-tool-platform:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
  backend:
    environment:
      AGENT_SERVICE_URL: http://agent:8000
      AGENT_SERVICE_TENANT_ID: "11111111-1111-4111-8111-111111111111"
      ATLAS_AGENT_SERVICE_KEY: ${ATLAS_AGENT_SERVICE_KEY:?Set ATLAS_AGENT_SERVICE_KEY}
    depends_on:
      agent:
        condition: service_started
  worker:
    environment:
      AGENT_SERVICE_URL: http://agent:8000
      AGENT_SERVICE_TENANT_ID: "11111111-1111-4111-8111-111111111111"
      ATLAS_AGENT_SERVICE_KEY: ${ATLAS_AGENT_SERVICE_KEY:?Set ATLAS_AGENT_SERVICE_KEY}
      RAG_GENERATION_ENABLED: ${RAG_GENERATION_ENABLED:-false}
      GENERATION_API_URL: ${GENERATION_API_URL:-}
      GENERATION_API_KEY: ${GENERATION_API_KEY:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-}
      GENERATION_MAX_OUTPUT_TOKENS: ${GENERATION_MAX_OUTPUT_TOKENS:-500}
    depends_on:
      agent:
        condition: service_started
  agent-smoke:
    profiles: ["smoke"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.agent_integration_smoke"]
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      AGENT_SERVICE_TENANT_ID: "11111111-1111-4111-8111-111111111111"
      INFERENCE_SERVICE_URL: http://backend:8000
    depends_on:
      - backend
      - worker
      - agent
