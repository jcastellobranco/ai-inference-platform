name: Container quality
on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.dockerignore'
      - '.github/workflows/container-quality.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.dockerignore'
      - '.github/workflows/container-quality.yml'
permissions:
  contents: read
jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: atlas-${{ matrix.name }}:ci
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: atlas-${{ matrix.name }}:ci
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
